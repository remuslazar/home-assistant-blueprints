blueprint:
  name: KNX - Light Control
  description: |
    Use KNX to switch a Home Assistant light entity on and off, with state
    feedback to KNX. Leave the state address empty if it is not used.
  author: remuslazar
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    light_entity:
      name: Light entity
      description: >
        The light to control and expose with KNX.
      selector:
        entity:
          domain: light
    switch_address:
      name: Switch group addresses
      description: >
        Group addresses that switch the light on and off, DPT 1.001. One address
        or a list, e.g. ["1/0/1", "0/0/32"]: the light's own address plus any
        central or floor address it should follow.
      selector:
        object:
      default: []
    switch_state_address:
      name: Switch state group address
      description: >
        Group address the light's on/off state is sent to, DPT 1.001, e.g.
        '1/0/2'. Read requests on it are answered.
      default: []

mode: parallel
max_exceeded: silent

# An empty destination would match every group address on the bus, so a
# trigger whose address is not set is disabled instead.
trigger_variables:
  _switch_address: !input switch_address
  _switch_state_address: !input switch_state_address

variables:
  light_entity: !input light_entity
  switch_state_address: !input switch_state_address
  has_switch_state: "{{ switch_state_address | count > 0 }}"
  is_on: "{{ is_state(light_entity, 'on') }}"

triggers:
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: state
    entity_id: !input light_entity
    id: light_entity
  - trigger: knx.telegram
    enabled: "{{ _switch_address | count > 0 }}"
    destination: !input switch_address
    type: switch
    outgoing: false
    group_value_read: false
    group_value_response: false
    id: switch_address
  - trigger: knx.telegram
    enabled: "{{ _switch_state_address | count > 0 }}"
    destination: !input switch_state_address
    outgoing: false
    group_value_write: false
    group_value_response: false
    id: switch_state_read

actions:
  - choose:
      - alias: Switch from KNX
        conditions:
          - condition: trigger
            id: switch_address
        sequence:
          - action: "light.turn_{{ 'on' if trigger.value == 'on' else 'off' }}"
            target:
              entity_id: "{{ light_entity }}"

      - alias: Answer a switch state read
        conditions:
          - condition: trigger
            id: switch_state_read
        sequence:
          - action: knx.send
            data:
              address: "{{ switch_state_address }}"
              payload: "{{ 1 if is_on else 0 }}"
              response: true

      - alias: Send the state at startup
        conditions:
          - condition: trigger
            id: startup
          - condition: template
            value_template: "{{ has_switch_state }}"
        sequence:
          - action: knx.send
            data:
              address: "{{ switch_state_address }}"
              payload: "{{ 1 if is_on else 0 }}"

      # unavailable/unknown count as off, so a light that drops off the
      # network shows as off on KNX
      - alias: Send state changes of the light
        conditions:
          - condition: trigger
            id: light_entity
          - condition: template
            value_template: >
              {{ has_switch_state and trigger.from_state is not none and trigger.to_state is not none
                 and (trigger.from_state.state == 'on') != (trigger.to_state.state == 'on') }}
        sequence:
          - action: knx.send
            data:
              address: "{{ switch_state_address }}"
              payload: "{{ 1 if trigger.to_state.state == 'on' else 0 }}"
