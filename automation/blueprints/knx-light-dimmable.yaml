blueprint:
  name: KNX - Light Control (dimmable)
  description: |
    Use KNX to control a dimmable Home Assistant light entity: switch, relative
    dimming (DPT 3.007), absolute brightness (DPT 5.001), with state feedback to
    KNX. Leave any address empty that the light does not use.
  author: remuslazar
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    light_entity:
      name: Light entity
      description: >
        The light to control and expose with KNX.
      selector:
        entity:
          domain: light
    switch_address:
      name: Switch group addresses
      description: >
        Group addresses that switch the light on and off, DPT 1.001. One address
        or a list, e.g. ["1/0/1", "0/0/32"]: the light's own address plus any
        central or floor address it should follow.
      selector:
        object:
      default: []
    switch_state_address:
      name: Switch state group address
      description: >
        Group address the light's on/off state is sent to, DPT 1.001, e.g.
        '1/0/2'. Read requests on it are answered.
      default: []
    dimm_address:
      name: Relative dimming group address
      description: >
        Group address for relative dimming (brighter/darker/stop), DPT 3.007,
        e.g. '1/0/3'.
      default: []
    value_address:
      name: Absolute dimming group address
      description: >
        Group address for an absolute brightness (0-100 %), DPT 5.001, e.g.
        '1/0/4'. 0 % switches the light off.
      default: []
    value_state_address:
      name: Brightness state group address
      description: >
        Group address the light's brightness is sent to, DPT 5.001, e.g.
        '1/0/5'. Read requests on it are answered.
      default: []
    dimm_time:
      name: Dimming time
      description: Time a relative dim takes from 0 to 100 %.
      selector:
        number:
          min: 1.0
          max: 20.0
          step: 0.1
          unit_of_measurement: seconds
          mode: slider
      default: 4
    dimm_steps:
      name: Dimming steps
      description: Steps a relative dim from 0 to 100 % is split into.
      selector:
        number:
          min: 2.0
          max: 100.0
          step: 1.0
          unit_of_measurement: steps
          mode: slider
      default: 20
    dimm_no_off:
      name: Dimming down never switches off
      description: Dimming down stops at the lowest brightness instead of switching the light off.
      selector:
        boolean:
      default: false
    dimm_no_on:
      name: Dimming up never switches on
      description: Dimming up does nothing while the light is off.
      selector:
        boolean:
      default: false

# parallel: a stop telegram must reach a dimming run that is still going
mode: parallel
max: 10
max_exceeded: silent

# An empty destination would match every group address on the bus, so a
# trigger whose address is not set is disabled instead.
trigger_variables:
  _switch_address: !input switch_address
  _switch_state_address: !input switch_state_address
  _dimm_address: !input dimm_address
  _value_address: !input value_address
  _value_state_address: !input value_state_address

variables:
  light_entity: !input light_entity
  switch_state_address: !input switch_state_address
  value_state_address: !input value_state_address
  _dimm_time: !input dimm_time
  _dimm_steps: !input dimm_steps
  dimm_no_off: !input dimm_no_off
  dimm_no_on: !input dimm_no_on
  has_switch_state: "{{ switch_state_address | count > 0 }}"
  has_value_state: "{{ value_state_address | count > 0 }}"
  dimm_time: "{{ _dimm_time | float(default=4) }}"
  dimm_steps: "{{ _dimm_steps | int(default=20) }}"
  dimm_step: "{{ (255 / dimm_steps) | round(0, 'ceil') | int }}"
  dimm_delay: "{{ (dimm_time * 1000 / dimm_steps) | int }}"
  is_on: "{{ is_state(light_entity, 'on') }}"
  brightness: "{{ state_attr(light_entity, 'brightness') | int(default=0) if is_on else 0 }}"

triggers:
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: state
    entity_id: !input light_entity
    id: light_entity
  - trigger: knx.telegram
    enabled: "{{ _switch_address | count > 0 }}"
    destination: !input switch_address
    type: switch
    outgoing: false
    group_value_read: false
    group_value_response: false
    id: switch_address
  - trigger: knx.telegram
    enabled: "{{ _switch_state_address | count > 0 }}"
    destination: !input switch_state_address
    outgoing: false
    group_value_write: false
    group_value_response: false
    id: switch_state_read
  - trigger: knx.telegram
    enabled: "{{ _dimm_address | count > 0 }}"
    destination: !input dimm_address
    type: control_dimming
    outgoing: false
    group_value_read: false
    group_value_response: false
    id: dimm_address
  - trigger: knx.telegram
    enabled: "{{ _value_address | count > 0 }}"
    destination: !input value_address
    type: percent
    outgoing: false
    group_value_read: false
    group_value_response: false
    id: value_address
  - trigger: knx.telegram
    enabled: "{{ _value_state_address | count > 0 }}"
    destination: !input value_state_address
    outgoing: false
    group_value_write: false
    group_value_response: false
    id: value_state_read

actions:
  - choose:
      - alias: Switch from KNX
        conditions:
          - condition: trigger
            id: switch_address
        sequence:
          - action: "light.turn_{{ 'on' if trigger.value == 'on' else 'off' }}"
            target:
              entity_id: "{{ light_entity }}"

      - alias: Absolute brightness from KNX
        conditions:
          - condition: trigger
            id: value_address
        sequence:
          - if:
              - condition: template
                value_template: "{{ trigger.value | int(default=0) == 0 }}"
            then:
              - action: light.turn_off
                target:
                  entity_id: "{{ light_entity }}"
            else:
              - action: light.turn_on
                target:
                  entity_id: "{{ light_entity }}"
                data:
                  brightness_pct: "{{ trigger.value | int }}"

      - alias: Relative dimming from KNX
        conditions:
          - condition: trigger
            id: dimm_address
          # step code 0 is the stop telegram: it ends a running dim through
          # the wait below and needs nothing of its own
          - condition: template
            value_template: "{{ trigger.value.step_code | int(default=0) != 0 }}"
          - condition: template
            value_template: >
              {{ trigger.value.control == 'decrease' or not dimm_no_on or is_on }}
        sequence:
          - variables:
              direction: "{{ 1 if trigger.value.control == 'increase' else -1 }}"
              max_steps: >
                {% if direction > 0 %}
                  {{ ((255 - brightness) / 255 * dimm_steps) | round(0, 'ceil') | int }}
                {% elif dimm_no_off %}
                  {{ (([brightness - 1, 0] | max) / 255 * dimm_steps) | round(0, 'ceil') | int }}
                {% else %}
                  {{ (brightness / 255 * dimm_steps) | round(0, 'ceil') | int }}
                {% endif %}
          - condition: template
            value_template: "{{ max_steps > 0 }}"
          - variables:
              released: false
          - repeat:
              sequence:
                # listen for the release while the light call runs: a Zigbee
                # light answers only after ~200 ms, and a telegram that comes
                # in before the wait starts would be missed
                - parallel:
                    - if:
                        - condition: template
                          value_template: >
                            {{ direction < 0 and dimm_no_off and
                               (state_attr(light_entity, 'brightness') | int(default=255)) - dimm_step < 1 }}
                      then:
                        - action: light.turn_on
                          target:
                            entity_id: "{{ light_entity }}"
                          data:
                            brightness: 1
                            transition: "{{ dimm_delay / 1000 }}"
                      else:
                        - action: light.turn_on
                          target:
                            entity_id: "{{ light_entity }}"
                          data:
                            brightness_step: "{{ direction * dimm_step }}"
                            transition: "{{ dimm_delay / 1000 }}"
                    - sequence:
                        # any further dimming telegram (stop or a new
                        # direction) ends this run; a new direction starts its
                        # own run. `wait` stays inside this branch, `released`
                        # carries the result out
                        - wait_for_trigger:
                            - trigger: knx.telegram
                              destination: !input dimm_address
                              outgoing: false
                              group_value_read: false
                              group_value_response: false
                          timeout:
                            milliseconds: "{{ dimm_delay }}"
                          continue_on_timeout: true
                        - variables:
                            released: "{{ wait.trigger is not none }}"
              until:
                - condition: template
                  value_template: "{{ released or repeat.index >= max_steps }}"

      - alias: Answer a switch state read
        conditions:
          - condition: trigger
            id: switch_state_read
        sequence:
          - action: knx.send
            data:
              address: "{{ switch_state_address }}"
              payload: "{{ 1 if is_on else 0 }}"
              response: true

      - alias: Answer a brightness read
        conditions:
          - condition: trigger
            id: value_state_read
        sequence:
          - action: knx.send
            data:
              address: "{{ value_state_address }}"
              payload: ["{{ brightness }}"]
              response: true

      - alias: Send the state at startup
        conditions:
          - condition: trigger
            id: startup
        sequence:
          - if:
              - condition: template
                value_template: "{{ has_switch_state }}"
            then:
              - action: knx.send
                data:
                  address: "{{ switch_state_address }}"
                  payload: "{{ 1 if is_on else 0 }}"
          - if:
              - condition: template
                value_template: "{{ has_value_state }}"
            then:
              - action: knx.send
                data:
                  address: "{{ value_state_address }}"
                  payload: ["{{ brightness }}"]

      - alias: Send state changes of the light
        conditions:
          - condition: trigger
            id: light_entity
          - condition: template
            value_template: "{{ trigger.from_state is not none and trigger.to_state is not none }}"
        sequence:
          - variables:
              old_on: "{{ trigger.from_state.state == 'on' }}"
              new_on: "{{ trigger.to_state.state == 'on' }}"
              old_brightness: "{{ trigger.from_state.attributes.brightness | int(default=0) if old_on else 0 }}"
              new_brightness: "{{ trigger.to_state.attributes.brightness | int(default=0) if new_on else 0 }}"
          # unavailable/unknown count as off, so a light that drops off the
          # network shows as off on KNX
          - if:
              - condition: template
                value_template: "{{ has_switch_state and old_on != new_on }}"
            then:
              - action: knx.send
                data:
                  address: "{{ switch_state_address }}"
                  payload: "{{ 1 if new_on else 0 }}"
          - if:
              - condition: template
                value_template: "{{ has_value_state and old_brightness != new_brightness }}"
            then:
              - action: knx.send
                data:
                  address: "{{ value_state_address }}"
                  payload: ["{{ new_brightness }}"]
